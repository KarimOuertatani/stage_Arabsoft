<div class="container mt-4">
  <mtx-alert *ngIf="isShowAlert" type="info" (dismiss)="onAlertDismiss()">
    🎉 Bienvenue dans le tableau de bord admin !
  </mtx-alert>

  <mat-grid-list cols="4" rowHeight="200px" gutterSize="16px">
    <mat-grid-tile *ngFor="let stat of stats">
      <mat-card class="stat-card">
        <mat-card-header>
          <mat-card-title>{{ stat.title }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <h3>{{ stat.amount }}</h3>
          <mtx-progress [value]="stat.progress.value" [color]="stat.color"></mtx-progress>
          <p>Données mensuelles</p>
        </mat-card-content>
      </mat-card>
    </mat-grid-tile>
  </mat-grid-list>
</div>
